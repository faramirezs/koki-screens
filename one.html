<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="lab.css">
<style>html,body{margin:0;background:#000}.bn{position:absolute;inset:0}</style></head>
<body>
<script src="vendor/gsap.min.js"></script>
<script>
// a module that throws never reaches its own handler, so this one must be classic
window.addEventListener("error", (e) => { window.__error = `${e.message} @ ${e.filename || "?"}:${e.lineno || 0}`; });
window.addEventListener("unhandledrejection", (e) => { window.__error = `rejected: ${e.reason}`; });
</script>
<script type="module">
import { renderBanner, buildMotion, settle } from "./lab.js";
const id = new URLSearchParams(location.search).get("id") || "b0001";
const all = await fetch("banners.json").then((r) => r.json());
const spec = all.find((b) => b.id === id) || all[0];
const bn = renderBanner(spec);
document.body.appendChild(bn);
await Promise.all([...document.querySelectorAll(".bn__img")].map((i) => i.decode().catch(() => {})));
await settle(bn);
const tl = buildMotion(bn, spec);
tl.pause(); tl.seek(Number(new URLSearchParams(location.search).get("t") || 6));
window.__ready = true;
</script></body></html>
