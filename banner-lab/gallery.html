<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner lab</title>
<link rel="stylesheet" href="lab.css">
<link rel="stylesheet" href="gallery.css">
</head>
<body>
<header class="bar">
  <div class="bar__title">Banner lab <span id="count" class="bar__count"></span></div>
  <div class="bar__filters" id="filters"></div>
  <div class="bar__right">
    <label class="chk"><input type="checkbox" id="only-flagged"> only flagged</label>
    <label class="chk"><input type="checkbox" id="hide-rejected"> hide rejected</label>
    <label class="chk"><input type="checkbox" id="pause"> pause motion</label>
    <select id="sort">
      <option value="shuffle">order: shuffle</option>
      <option value="index">order: index</option>
      <option value="unseen">order: unseen first</option>
      <option value="liked">order: liked first</option>
    </select>
    <button id="reshuffle">reshuffle</button>
    <button id="export">export feedback</button>
  </div>
</header>

<nav class="modes" id="modes"></nav>

<div class="legend" id="legend"></div>

<main id="grid" class="grid"></main>

<textarea id="export-box" class="export-box" hidden></textarea>

<script src="vendor/gsap.min.js"></script>
<script type="module" src="gallery.js"></script>
</body>
</html>
